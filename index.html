<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅遊規劃器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2937;--mut:#6b7280;--ac:#0f766e;--ln:#e5e7eb;--warn:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2328;--tx:#e5e7eb;--mut:#9ca3af;--ac:#2dd4bf;--ln:#323941;--warn:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Noto Sans TC",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
header label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
#title{font-size:18px;font-weight:700;min-width:200px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;max-width:100%}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.chip{margin-left:auto;font-weight:700;color:var(--ac);font-size:15px;align-self:center}
main{display:grid;grid-template-columns:minmax(340px,470px) 1fr;gap:12px;padding:12px}
@media(max-width:860px){main{grid-template-columns:1fr}.mapwrap{order:-1;position:static!important}#map{height:45vh!important}}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px}
summary{padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
summary .n{background:var(--ac);color:#fff;border-radius:50%;min-width:22px;height:22px;text-align:center;font-size:12px;line-height:22px}
summary .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}summary .d,summary .c{color:var(--mut);font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 10px 10px}
.g label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.g .w{grid-column:1/-1}
.g input,.g select,.g textarea{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}.seg{grid-column:1/-1;font-size:12px;background:var(--bg);border-radius:8px;padding:6px 8px;color:var(--mut)}
.sub{grid-column:1/-1;font-weight:700;font-size:12px;color:var(--ac);margin-top:4px}
.mapwrap{position:sticky;top:8px;align-self:start;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
#map{height:calc(100vh - 150px);min-height:380px}
.bar{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap;border-top:1px solid var(--ln);font-size:13px}
#msg{padding:6px 10px;background:#fff3cd;color:#664d03;font-size:13px}
.pin{width:26px;height:26px;border-radius:50%;background:#fff;color:#222;border:3px solid var(--ac);font:700 11px/20px system-ui;text-align:center}.pin.on{background:var(--ac);color:#fff}
.tr{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #555;font-size:16px;line-height:24px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:left}td.r,th.r{text-align:right}
.bg{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bg i{display:block;height:100%}
.over{color:var(--warn);font-weight:700}.mut{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
<label>旅程名稱<input id="title" data-h="title"></label>
<label>出發日<input type="date" id="start" data-h="start"></label>
<label>人數<input type="number" min="1" id="n" data-h="n" style="width:64px"></label>
<label>幣別<input id="cur" data-h="cur" style="width:64px"></label>
<label>匯率(1 外幣=台幣)<input type="number" step="any" id="rate" data-h="rate" style="width:90px"></label>
<label>預算上限<input type="number" min="0" id="cap" data-h="cap" style="width:100px"></label>
<button id="exp">匯出</button><button id="impb">匯入</button><button id="reset">重設</button><input type="file" id="imp" accept=".json" hidden>
<span class="chip" id="tot"></span>
</header>
<main>
<section>
<div class="tabs"><button class="on" data-t="plan">🗓 行程</button><button data-t="bud">💰 預算</button></div>
<div id="plan"><div id="list"></div><button class="p" id="add">＋ 新增景點</button></div>
<div id="bud" hidden></div>
</section>
<section class="mapwrap">
<div id="msg" hidden></div><div id="map"></div>
<div class="bar"><button class="p" id="play">▶ 播放路線</button>
<select id="spd"><option value="4000">慢</option><option value="2500" selected>中</option><option value="1300">快</option></select>
<label><input type="checkbox" id="road"> 巴士/租車用道路路徑</label>
<select id="base"><option value="osm">OpenStreetMap</option><option value="carto">CARTO 淡色</option><option value="google">Google 地圖</option></select><button id="gk" title="Google 金鑰">🔑</button></div>
</section>
</main>
<script>
const KEY="trip-planner-v2",$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODES={plane:["✈️","飛機","#2563eb",700],train:["🚄","高鐵/火車","#16a34a",150],bus:["🚌","巴士","#d97706",60],ferry:["⛴️","渡輪","#0891b2",35],car:["🚗","租車/包車","#7c3aed",70],walk:["🚶","步行","#64748b",5]};
const DAY=864e5,dms=d=>Date.parse(d+"T00:00:00Z");
const addDays=(d,n)=>{const x=new Date(dms(d));x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((dms(b)-dms(a))/DAY),fmt=n=>Math.round(n||0).toLocaleString();
const mk=o=>Object.assign({date:"",name:"新景點",lat:41.9,lon:12.5,mode:"train",tCost:0,tTime:"",hotel:"",hCost:0,nights:0,aCost:0,fCost:0,oCost:0,note:""},o);
const SEED=[[0,"桃園機場 TPE",25.0777,121.2325,"plane",0,"D1 出發,夜宿機上。託運行李聯運一本票直掛杜布羅夫尼克(DBV)。","長榮 BR071 23:25 起飛(直飛)","夜宿機上"],[1,"慕尼黑機場 MUC",48.3538,11.7861,"plane",0,"D2 07:35 降落,悠閒轉機(可使用貴賓室)。","長榮 BR071 直飛","夜宿機上"],[1,"杜布羅夫尼克 舊城區",42.6411,18.1077,"plane",3,"D2 機場公車到派勒門進房,漫步大理石街道。D3 08:00 登古城牆避開人潮、洛夫里耶納茨堡壘(冰火紅堡)、黃昏纜車上 Srd 山看夕陽(建議 Dubrovnik Pass 1 日券)。","漢莎 LH1710 14:45 → 16:20","杜布羅夫尼克舊城區"],[3,"科托(黑山)",42.4247,18.7712,"car",0,"D4 跨境一日遊:科托峽灣、佩拉斯特(搭船看岩石聖母島)、科托古城,傍晚返回克羅埃西亞。需通過申根邊界實體查驗。","小團或自駕包車","杜布羅夫尼克舊城區"],[4,"洛克魯姆島 / Gruž 港",42.6577,18.087,"car",0,"D5 白天搭渡船到 Lokrum 島漫步、拍鐵王座。19:30 前拉行李到 Gruž 港換實體船票通關登船。","Jadrolinija 跨境夜航 22:00","夜宿跨境渡輪(私人臥艙)"],[5,"巴里 Bari",41.1253,16.8666,"ferry",0,"D6 07:00 渡輪抵達巴里港,清晨逛老城、朝聖手工貓耳朵麵一條街。","渡輪隔日 07:00 抵達","莫諾波利"],[5,"波利尼亞諾 Polignano a Mare",40.9966,17.2186,"train",0,"D6 下午造訪懸崖小鎮。","自駕或 Trenitalia 義大利國鐵",""],[5,"莫諾波利 Monopoli",40.9515,17.3003,"train",2,"D6 傍晚入住海濱漁村。D7 連住免搬行李,傍晚海景餐廳享用海鮮大餐。","",""],[6,"阿爾貝羅貝洛 Alberobello",40.7849,17.237,"train",0,"D7 輕裝前往世界遺產蘑菇村深度觀光,傍晚返回莫諾波利。","區域火車或自駕(約 30 分鐘)","莫諾波利"],[7,"馬泰拉 Matera",40.6664,16.6043,"car",1,"D8 退房後前往巴西利卡塔大區,探索 Sassi 洞穴城(007 電影場景),黃昏看點燈夜景。","自駕或租車 / 接駁","馬泰拉洞穴飯店"],[8,"巴里機場 BRI",41.1389,16.7606,"car",0,"D9 從馬泰拉接駁至巴里機場。","接駁車",""],[8,"瓦萊塔 Valletta",35.8997,14.5147,"plane",1,"D9 抵達馬爾他,漫步舊薄荷街,參觀聖若望副主教座堂。","跨國區域班機 BRI → MLA","瓦萊塔市區飯店"],[9,"姆迪納 Mdina",35.886,14.403,"bus",0,"D10 上午參觀中世紀寧靜之城,再到藍洞(Blue Grotto)搭小船。","當地交通",""],[9,"拿坡里 Napoli",40.8518,14.2681,"plane",1,"D10 傍晚飛抵拿坡里,晚餐朝聖百年披薩老店。","地中海區域航線 MLA → NAP","拿坡里市區"],[10,"龐貝 Pompeii",40.7497,14.4869,"train",0,"D11 全日探索火山灰凝結的龐貝古城。","維蘇威地方鐵道 Circumvesuviana",""],[10,"蘇連多 Sorrento",40.6263,14.3758,"train",3,"D11 傍晚入住南義度假門戶。D13 當晚可選住蘇連多或拿坡里市區。","Circumvesuviana","蘇連多"],[11,"卡布里島 Capri",40.5532,14.2222,"ferry",0,"D12 清晨轉小船進藍洞(Grotta Azzurra);下午在安那卡布里搭單人纜車登索拉羅山頂看海景。","蘇連多碼頭高速快艇往返","蘇連多"],[12,"波西塔諾 / 阿瑪菲 Positano·Amalfi",40.6281,14.485,"bus",0,"D13 阿瑪菲海岸公路,漫步波西塔諾與阿瑪菲古鎮。","SITA 巴士或私人包車","蘇連多 或 拿坡里市區"],[13,"拿坡里 Napoli(返程)",40.8518,14.2681,"bus",0,"D14 白天市區漫步、採買,喝著名的拿坡里濃縮咖啡。","巴士或火車",""],[13,"慕尼黑機場 MUC",48.3538,11.7861,"plane",1,"D14 傍晚提早北返慕尼黑,防範隔天失接風險。","歐陸班機約 1.5 小時","慕尼黑機場周邊飯店"],[15,"桃園機場 TPE",25.0777,121.2325,"plane",0,"D15 上午在 MUC 第二航廈辦理託運與退稅,長榮直飛返台,夜宿機上。D16 06:30 降落桃園,平安回家。","長榮 BR072 10/4 11:30 起飛 → 10/5 06:30 抵達","溫暖的家"]];
function seed(){const st="2027-09-20";return{title:"地中海 16 天:克羅埃西亞・南義・馬爾他",start:st,n:2,cur:"EUR",rate:35,cap:0,road:false,stops:SEED.map(r=>mk({date:addDays(st,r[0]),name:r[1],lat:r[2],lon:r[3],mode:r[4],nights:r[5],note:r[6],tTime:r[7],hotel:r[8]}))}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.stops)&&v.stops.length){v.stops=v.stops.map(mk);return Object.assign(seed(),v)}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}}
let T=load(),act=0,pickIdx=null,roads={},E=null,tok=0,playing=false,dt=0;
const BK="trip-planner-base",KK="gmaps-key",DEFAULT_KEY="AIzaSyA9mTCpevUY7nKJ6yUv_pPN7_EH6bWO5Eo";
const map={flyTo:(p,z)=>E&&E.fly(p,z),flyToBounds:b=>E&&E.fit(b,12),fitBounds:b=>E&&E.fit(b,9)};
const gg=p=>({lat:p[0],lng:p[1]});
function gkey(){let k=null;try{k=localStorage.getItem(KK)}catch(e){}return k===null?DEFAULT_KEY:k}
const S=()=>T.stops,num=v=>+v||0;
function msg(t){$("msg").textContent=t||"";$("msg").hidden=!t;if(t)setTimeout(()=>{$("msg").hidden=true},5000)}
function hv(a,b){const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon),h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hm=h=>h<1?Math.round(h*60)+" 分鐘":Math.floor(h)+" 小時 "+Math.round((h%1)*60)+" 分";
const rk=i=>S()[i].mode+"|"+S()[i-1].lat+","+S()[i-1].lon+"|"+S()[i].lat+","+S()[i].lon;

/* ---------- 預算 ---------- */
function calc(){const N=num(T.n)||1,c={tr:0,hot:0,act:0,food:0,oth:0},per=S().map(s=>{const x={tr:num(s.tCost)*N,hot:num(s.hCost)*num(s.nights),act:num(s.aCost)*N,food:num(s.fCost)*N,oth:num(s.oCost)};for(const k in x)c[k]+=x[k];return x.tr+x.hot+x.act+x.food+x.oth});
  return{c,per,total:per.reduce((a,b)=>a+b,0)}}
function span(){const d=S().map(s=>s.date).filter(Boolean).sort();return d.length?diff(d[0],d[d.length-1])+1:1}
function renderBudget(){const {c,per,total}=calc(),N=num(T.n)||1,days=span(),cap=num(T.cap),cu=esc(T.cur);
  const rows=[["tr","🚄 交通","#2563eb"],["hot","🏨 住宿","#7c3aed"],["act","🎟 門票/活動","#d97706"],["food","🍽 餐飲","#16a34a"],["oth","🧾 其他","#64748b"]];
  $("tot").textContent="預估 "+T.cur+" "+fmt(total)+(cap&&total>cap?" ⚠️":"");
  $("bud").innerHTML=`<div class="card"><table>${rows.map(r=>`<tr><td>${r[1]}</td><td class="r">${cu} ${fmt(c[r[0]])}</td><td style="width:35%"><div class="bg"><i style="width:${total?c[r[0]]/total*100:0}%;background:${r[2]}"></i></div></td></tr>`).join("")}
<tr><td><b>合計</b></td><td class="r"><b>${cu} ${fmt(total)}</b></td><td></td></tr></table></div>
<div class="card"><table><tr><td>每人</td><td class="r">${cu} ${fmt(total/N)}</td></tr><tr><td>每天(共 ${days} 天)</td><td class="r">${cu} ${fmt(total/days)}</td></tr>
<tr><td>約合台幣</td><td class="r">NT$ ${fmt(total*num(T.rate))}</td></tr>
${cap?`<tr><td>預算上限 ${cu} ${fmt(cap)}</td><td class="r ${total>cap?"over":""}">${total>cap?"超出 "+fmt(total-cap):"尚餘 "+fmt(cap-total)}</td></tr>`:""}</table></div>
<div class="card"><b>各站小計</b><table>${S().map((s,i)=>`<tr><td>${i+1}. ${esc(s.name)}</td><td class="mut">${(s.date||"").slice(5)}</td><td class="r">${fmt(per[i])}</td></tr>`).join("")}</table>
<p class="mut">計算方式:交通、門票、餐飲 × 人數;住宿 = 每晚整間價格 × 晚數;其他為整團金額。</p></div>`}

/* ---------- 行程卡片 ---------- */
const F=(i,k,l,t="text",x="",w="")=>`<label class="${w}">${l}<input data-k="${k}" type="${t}" value="${esc(S()[i][k])}" ${x}></label>`,NF=(i,k,l)=>F(i,k,l,"number",'min="0" step="any"');
function segInfo(i){if(!i)return"🏁 起點(交通欄代表從出發地抵達此站的方式,如國際航班)";const a=S()[i-1],b=S()[i],m=MODES[b.mode],d=hv(a,b),r=roads[rk(i)];
  let t=`${m[0]} 直線約 ${fmt(d)} km,粗估 ${hm(d/m[3]+(b.mode==="plane"?2:0))}`;if(r&&r.dist)t+=`;道路約 ${fmt(r.dist/1000)} km、${hm(r.dur/3600)}`;return t}
function sum(i){const s=S()[i],el=$("list").querySelector(`details[data-i="${i}"] summary`);if(!el)return;const x=calc().per[i];
  el.innerHTML=`<span class="n">${i+1}</span><span class="nm">${MODES[s.mode][0]} ${esc(s.name)}</span><span class="d">${(s.date||"").slice(5)}</span><span class="c">${fmt(x)}</span>`}
function card(s,i){return`<details data-i="${i}" ${i===act?"open":""}><summary></summary><div class="g">
${F(i,"date","日期","date")}${F(i,"name","景點 / 城市")}
${F(i,"lat","緯度","number",'step="any"')}${F(i,"lon","經度","number",'step="any"')}
<div class="row"><button data-a="search">🔍 依名稱搜尋座標</button><button data-a="pick">📍 在地圖上點選</button></div>
<div class="sub">抵達交通</div>
<label>方式<select data-k="mode">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${s.mode===k?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label>${NF(i,"tCost","費用(每人)")}
${F(i,"tTime","時間 / 班次備註","text","","w")}<div class="seg" data-seg>${segInfo(i)}</div>
<div class="sub">住宿與花費</div>
${F(i,"hotel","住宿名稱","text","","w")}${NF(i,"hCost","每晚(整間)")}${NF(i,"nights","晚數")}${NF(i,"aCost","門票/活動(每人)")}${NF(i,"fCost","餐飲(每人)")}${NF(i,"oCost","其他(整團)")}
<label class="w">備註<textarea data-k="note" rows="2">${esc(s.note)}</textarea></label>
<div class="row"><button data-a="up">↑ 上移</button><button data-a="down">↓ 下移</button><button data-a="del">🗑 刪除</button></div></div></details>`}
function renderList(){$("list").innerHTML=S().map(card).join("");S().forEach((_,i)=>sum(i));renderBudget()}
function refreshSeg(i){const e=$("list").querySelector(`details[data-i="${i}"] [data-seg]`);if(e)e.textContent=segInfo(i)}

/* ---------- 地圖引擎 ---------- */
const DOTH=e=>`<div class="tr" style="width:36px;height:36px;font-size:22px;line-height:32px">${e}</div>`;
const LF={
 init(){this.m=L.map("map").setView([42,13],5);this.g=L.layerGroup().addTo(this.m);this.setBase();this.m.on("click",e=>onMap(e.latlng.lat,e.latlng.lng))},
 setBase(){if(this.t)this.m.removeLayer(this.t);const c=$("base").value==="carto";this.t=L.tileLayer(c?"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png":"https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"+(c?" © CARTO":"")}).addTo(this.m)},
 clear(){this.g.clearLayers()},
 line(p,c,d){L.polyline(p,{color:c,weight:4,opacity:.9,dashArray:d==="d"?"8 8":d==="w"?"2 6":null}).addTo(this.g)},
 badge(p,t,c){L.marker(p,{icon:L.divIcon({className:"",html:`<div class="tr" style="border-color:${c}">${t}</div>`,iconSize:[28,28]}),interactive:false}).addTo(this.g)},
 pin(p,i,on,title,cb){L.marker(p,{icon:L.divIcon({className:"",html:`<div class="pin ${on?"on":""}">${i+1}</div>`,iconSize:[26,26]}),title}).on("click",cb).addTo(this.g)},
 dot(p,e){if(!this.d)this.d=L.marker(p||[0,0],{icon:L.divIcon({className:"",html:DOTH(e||"📍"),iconSize:[36,36]}),zIndexOffset:999,interactive:false}).addTo(this.m);if(p)this.d.setLatLng(p);if(e)this.d.setIcon(L.divIcon({className:"",html:DOTH(e),iconSize:[36,36]}))},
 dotOff(){if(this.d){this.m.removeLayer(this.d);this.d=null}},
 fly(p,z){this.m.flyTo(p,z,{duration:1.3})},
 fit(ps,mz){this.m.flyToBounds(ps,{padding:[60,60],duration:1.5,maxZoom:mz})},
 destroy(){this.dotOff();this.m.remove();this.m=null}
};
const GM={
 async init(){
  if(!(window.google&&google.maps)){const k=gkey();if(!k)throw new Error("尚未設定 Google Maps 金鑰,請按 🔑 輸入");
   await new Promise((res,rej)=>{window.gm_ready=res;window.gm_authFailure=()=>msg("Google 金鑰驗證失敗:請確認已啟用 Maps JavaScript API、帳單,且金鑰的網站限制包含目前網址");
    const s=document.createElement("script");s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(k)+"&callback=gm_ready&loading=async&language=zh-TW";
    s.onerror=()=>rej(new Error("無法載入 Google Maps"));document.head.appendChild(s)})}
  this.m=new google.maps.Map($("map"),{center:gg([42,13]),zoom:5,streetViewControl:false});this.o=[];this.zt=0;
  this.m.addListener("click",e=>onMap(e.latLng.lat(),e.latLng.lng()))},
 ic(s,f,c,w){return{path:google.maps.SymbolPath.CIRCLE,scale:s,fillColor:f,fillOpacity:1,strokeColor:c,strokeWeight:w}},
 clear(){this.o.forEach(x=>x.setMap(null));this.o=[]},
 line(p,c,d){const b={map:this.m,path:p.map(gg),strokeColor:c,zIndex:2},S2=google.maps.SymbolPath;
  this.o.push(new google.maps.Polyline(d==="d"?{...b,strokeOpacity:0,icons:[{icon:{path:"M 0,-1 0,1",strokeOpacity:1,strokeColor:c,scale:3},offset:"0",repeat:"14px"}]}
   :d==="w"?{...b,strokeOpacity:0,icons:[{icon:{path:S2.CIRCLE,fillOpacity:1,fillColor:c,strokeColor:c,scale:1.8},offset:"0",repeat:"9px"}]}:{...b,strokeOpacity:.9,strokeWeight:4}))},
 badge(p,t,c){this.o.push(new google.maps.Marker({map:this.m,position:gg(p),clickable:false,zIndex:5,icon:this.ic(14,"#fff",c,2),label:{text:t,fontSize:"15px"}}))},
 pin(p,i,on,title,cb){const k=new google.maps.Marker({map:this.m,position:gg(p),title,zIndex:50,icon:this.ic(on?13:11,on?"#0f766e":"#fff","#0f766e",3),label:{text:String(i+1),color:on?"#fff":"#222",fontSize:"11px",fontWeight:"700"}});k.addListener("click",cb);this.o.push(k)},
 dot(p,e){if(!this.d)this.d=new google.maps.Marker({map:this.m,position:gg(p||[42,13]),zIndex:1000,clickable:false,icon:this.ic(18,"#fff","#0f766e",3),label:{text:e||"📍",fontSize:"20px"}});if(p)this.d.setPosition(gg(p));if(e)this.d.setLabel({text:e,fontSize:"20px"})},
 dotOff(){if(this.d){this.d.setMap(null);this.d=null}},
 async fly(p,z){this.m.panTo(gg(p));const t=++this.zt;let c=this.m.getZoom();while(c!==z&&t===this.zt&&this.m){c+=c<z?1:-1;this.m.setZoom(c);await sleep(200)}},
 fit(ps,mz){this.zt++;const bd=new google.maps.LatLngBounds();ps.forEach(p=>bd.extend(gg(p)));this.m.fitBounds(bd,{top:80,bottom:80,left:80,right:80});
  google.maps.event.addListenerOnce(this.m,"idle",()=>{if(this.m&&this.m.getZoom()>mz)this.m.setZoom(mz)})},
 destroy(){this.clear();this.dotOff();google.maps.event.clearInstanceListeners(this.m);this.m=null;$("map").innerHTML=""}
};
async function useBase(){const v=$("base").value;try{localStorage.setItem(BK,v)}catch(e){}stop();
  if(E===LF&&v!=="google"){LF.setBase();return}
  if(E&&E.destroy)E.destroy();E=null;
  try{const n=v==="google"?GM:LF;await n.init();E=n;drawMap(true)}
  catch(err){msg(err.message+"。已改用 CARTO 底圖");$("base").value="carto";await useBase()}}
const pts=i=>{const r=roads[rk(i)];return r&&r.pts?r.pts:[[S()[i-1].lat,S()[i-1].lon],[S()[i].lat,S()[i].lon]]};
const midOf=p=>p.length===2?[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2]:p[p.length>>1];
function drawMap(fit){if(!E)return;E.clear();const ps=[];
  S().forEach((s,i)=>{ps.push([s.lat,s.lon]);if(i){const m=MODES[s.mode],p=pts(i);
    E.line(p,m[2],s.mode==="plane"||s.mode==="ferry"?"d":s.mode==="walk"?"w":"");E.badge(midOf(p),m[0],m[2]);
    if(T.road&&(s.mode==="car"||s.mode==="bus"))road(i)}});
  S().forEach((s,i)=>E.pin([s.lat,s.lon],i,i===act,s.name,()=>focus(i)));
  if(fit&&ps.length)E.fit(ps,9)}
async function road(i){const k=rk(i);if(roads[k]!==undefined)return;roads[k]=null;const a=S()[i-1],b=S()[i];
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`).then(x=>x.json());
    const q=r.routes&&r.routes[0];roads[k]=q?{pts:q.geometry.coordinates.map(c=>[c[1],c[0]]),dist:q.distance,dur:q.duration}:false}catch(e){roads[k]=false}
  clearTimeout(dt);dt=setTimeout(()=>{drawMap(false);refreshSeg(i)},200)}
function focus(i){act=i;const d=$("list").querySelector(`details[data-i="${i}"]`);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"nearest"})}drawMap(false);map.flyTo([S()[i].lat,S()[i].lon],10,{duration:1.2})}

/* ---------- 播放 ---------- */
function stop(){playing=false;tok++;$("play").textContent="▶ 播放路線";if(E)E.dotOff()}
async function play(){if(playing){stop();return}if(!E)return;playing=true;const my=++tok;$("play").textContent="⏸ 停止";
  act=0;drawMap(false);E.dot([S()[0].lat,S()[0].lon],"📍");E.fly([S()[0].lat,S()[0].lon],9);await sleep(1800);
  for(let i=1;i<S().length&&my===tok;i++){const a=S()[i-1],b=S()[i],m=MODES[b.mode],p=pts(i);
    E.fit([[a.lat,a.lon],[b.lat,b.lon]],12);await sleep(1800);if(my!==tok)return;
    E.dot(null,m[0]);const dur=+$("spd").value,t0=performance.now(),n=p.length-1;
    await new Promise(res=>{const f=now=>{if(my!==tok)return res();const k=Math.min(1,(now-t0)/dur),x=k*n,j=Math.min(n-1,Math.floor(x)),r=x-j;
      E.dot([p[j][0]+(p[j+1][0]-p[j][0])*r,p[j][1]+(p[j+1][1]-p[j][1])*r]);if(k<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
    if(my!==tok)return;act=i;drawMap(false);E.fly([b.lat,b.lon],10);await sleep(1800)}
  if(my===tok)stop()}

/* ---------- 事件 ---------- */
let after=0;
$("list").addEventListener("input",e=>{const el=e.target,k=el.dataset.k;if(!k)return;const i=+el.closest("details").dataset.i;
  S()[i][k]=el.type==="number"?(el.value===""?0:+el.value):el.value;save();sum(i);renderBudget();refreshSeg(i);if(S()[i+1])refreshSeg(i+1);
  if(["lat","lon","mode","name"].includes(k)){clearTimeout(after);after=setTimeout(()=>drawMap(false),300)}});
$("list").addEventListener("click",async e=>{const sm=e.target.closest("summary");if(sm){const i=+sm.parentNode.dataset.i;setTimeout(()=>{act=i;drawMap(false);map.flyTo([S()[i].lat,S()[i].lon],9,{duration:1})},0);return}
  const b=e.target.closest("button[data-a]");if(!b)return;const i=+b.closest("details").dataset.i,a=b.dataset.a,s=S()[i];
  if(a==="search"){if(!s.name.trim())return;msg("搜尋中…");try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh-TW&q="+encodeURIComponent(s.name)).then(x=>x.json());
      if(!r.length){msg("找不到這個地點,請換個關鍵字(可加國家或城市名)");return}s.lat=+(+r[0].lat).toFixed(5);s.lon=+(+r[0].lon).toFixed(5);save();act=i;renderList();drawMap(false);map.flyTo([s.lat,s.lon],10);msg("已找到:"+r[0].display_name)}catch(err){msg("搜尋失敗,請檢查網路")}}
  else if(a==="pick"){pickIdx=i;msg("請在地圖上點一下要設定的位置")}
  else if(a==="del"){if(S().length>1&&confirm("刪除這一站?")){S().splice(i,1);act=Math.min(act,S().length-1);save();renderList();drawMap(false)}}
  else{const j=a==="up"?i-1:i+1;if(j<0||j>=S().length)return;[S()[i],S()[j]]=[S()[j],S()[i]];act=j;save();renderList();drawMap(false)}});
document.querySelectorAll("[data-h]").forEach(el=>el.addEventListener("input",()=>{const k=el.dataset.h;if(k==="start")return;T[k]=el.type==="number"?num(el.value):el.value;save();renderBudget()}));
$("start").addEventListener("change",e=>{const v=e.target.value;if(!v)return;const d=diff(T.start,v);S().forEach(s=>{if(s.date)s.date=addDays(s.date,d)});T.start=v;save();renderList()});
$("add").onclick=()=>{const l=S()[S().length-1];S().push(mk({date:l.date?addDays(l.date,num(l.nights)):T.start,name:"新景點",lat:l.lat,lon:l.lon}));act=S().length-1;save();renderList();drawMap(false);msg("請輸入名稱後按「🔍 依名稱搜尋座標」");const d=$("list").lastElementChild;d&&d.scrollIntoView({behavior:"smooth"})};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("plan").hidden=b.dataset.t!=="plan";$("bud").hidden=b.dataset.t!=="bud"});
$("road").onchange=e=>{T.road=e.target.checked;save();drawMap(false)};$("base").onchange=useBase;$("gk").onclick=()=>{const k=prompt("輸入 Google Maps API 金鑰(留空則清除):","");if(k===null)return;try{localStorage.setItem(KK,k.trim())}catch(e){}if($("base").value==="google")location.reload()};$("play").onclick=play;
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(T,null,1)],{type:"application/json"}));a.download=(T.title||"trip")+".json";a.click()};
$("impb").onclick=()=>$("imp").click();
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.stops)||!v.stops.length)throw 0;v.stops=v.stops.map(mk);T=Object.assign(seed(),v);act=0;roads={};save();init()}catch(x){alert("檔案格式不正確")}};r.readAsText(f);e.target.value=""};
$("reset").onclick=()=>{if(confirm("重設為範例行程?目前內容會消失(建議先匯出備份)")){T=seed();act=0;roads={};save();init()}};
function onMap(la,lo){if(pickIdx==null)return;const s=S()[pickIdx];s.lat=+la.toFixed(5);s.lon=+lo.toFixed(5);act=pickIdx;pickIdx=null;save();renderList();drawMap(false);msg("座標已更新")}
function init(){stop();["title","start","n","cur","rate","cap"].forEach(k=>$(k).value=T[k]??"");$("road").checked=!!T.road;renderList();E?drawMap(true):useBase()}
try{const b=localStorage.getItem(BK);if(b)$("base").value=b}catch(e){}
init();
